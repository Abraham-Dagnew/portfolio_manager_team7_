<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio Manager{% endblock %}</title>
    <!-- Update CSS link here -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">P</div>
                <div>
                    <div class="brand-title">Portfolio</div>
                    <div class="brand-subtitle">Investment Dashboard</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Main</div>
                <a href="/portfolio" class="nav-item {% if active_page == 'portfolio' %}active{% endif %}">Browse Holdings</a>
                <a href="/performance" class="nav-item {% if active_page == 'performance' %}active{% endif %}">Performance</a>
                <a href="/add" class="nav-item buy-link {% if active_page == 'add' %}active{% endif %}">Buy</a>
            </nav>

            <div class="balance-widget">
                <div class="balance-label">Cash Balance</div>
                <div class="balance-amount" id="balance-amount">Loading&hellip;</div>
                <div class="balance-error" id="balance-error"></div>
                <form id="depositForm" class="deposit-form">
                    <input type="number" id="fundsAmount" min="0.01" step="0.01" placeholder="Amount">
                    <button type="submit" id="depositSubmit" title="Add funds">+</button>
                    <button type="button" id="withdrawSubmit" title="Withdraw funds">&minus;</button>
                </form>
            </div>
        </aside>

        <div class="app-main">
            <header class="topbar">
                <span class="topbar-brand">PortfolioTracker</span>
                {% if active_page == 'portfolio' %}
                <input class="topbar-search" type="text" placeholder="Search by ticker...">
                {% endif %}
            </header>

            <main class="container">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script type="module" src="/static/js/balance.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
